name: Windows build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/MPQTikTool/MPQTikTool.csproj
      - name: Build
        run: dotnet build src/MPQTikTool/MPQTikTool.csproj --configuration Release --no-restore
