name: Windows build and release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mpqtiktool-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/MPQTikTool/MPQTikTool.csproj

      - name: Build
        run: dotnet build src/MPQTikTool/MPQTikTool.csproj --configuration Release --no-restore

      - name: Run MPQ primitive self-tests
        run: dotnet run --project tests/MPQTikTool.SelfTest/MPQTikTool.SelfTest.csproj --configuration Release

      - name: Publish portable Windows x64 app
        run: dotnet publish src/MPQTikTool/MPQTikTool.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output publish/win-x64

      - name: Verify output
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/win-x64/MPQTikTool.exe")) {
            throw "Published executable was not found."
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath "MPQTikTool-win-x64.zip" -Force

      - name: Upload build package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MPQTikTool-win-x64
          path: MPQTikTool-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish preview release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ github.run_number }}
          name: "MPQ Tik Tool Preview #${{ github.run_number }}"
          prerelease: true
          make_latest: true
          files: MPQTikTool-win-x64.zip
          generate_release_notes: true
